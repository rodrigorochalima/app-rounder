<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Round UTI v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Round UTI</h1>
            <p class="text-gray-600 mt-2">Sistema Definitivo v2.0 - Standalone</p>
        </div>

        <!-- Form -->
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-bold mb-6">Gerar Round de Hoje</h2>

            <!-- API Key -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    API Key do Groq (Gratuita) <span id="apiSalva" class="text-green-600"></span>
                </label>
                <input 
                    type="password" 
                    id="apiKey"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Cole sua API Key aqui"
                />
                <p class="text-sm text-gray-500 mt-1">
                    Obtenha em: <a href="https://console.groq.com/" target="_blank" class="text-blue-600 underline">console.groq.com</a>
                    (só precisa informar uma vez, será salva no navegador)
                </p>
            </div>

            <!-- Documento Anterior -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Documento do Round Anterior
                </label>
                <input 
                    type="file" 
                    id="docAnterior"
                    accept=".docx"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                />
                <p id="docAnteriorNome" class="text-sm text-gray-600 mt-1"></p>
            </div>

            <!-- Transcrição -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Transcrição ou WhatsApp ZIP
                </label>
                <input 
                    type="file" 
                    id="transcricao"
                    accept=".docx,.txt,.zip,audio/*"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                />
                <p id="transcricaoNome" class="text-sm text-gray-600 mt-1"></p>
                <p class="text-sm text-gray-500 mt-1">
                    Aceita: Documentos, ZIP do WhatsApp, áudios
                </p>
            </div>

            <!-- Botão Processar -->
            <button 
                id="btnProcessar"
                disabled
                class="w-full py-3 px-6 rounded-lg font-semibold text-white transition-all duration-200 disabled:bg-gray-400 disabled:cursor-not-allowed bg-blue-600 hover:bg-blue-700"
            >
                <span id="btnTexto">Gerar Round de Hoje</span>
            </button>

            <!-- Mensagem de Erro -->
            <div id="erro" class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg"></div>

            <!-- Mensagem de Sucesso -->
            <div id="sucesso" class="hidden mt-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg"></div>
        </div>

        <!-- Histórico -->
        <div class="bg-white rounded-lg shadow-lg p-6 mt-6">
            <h2 class="text-2xl font-bold mb-4">📚 Histórico</h2>
            <p class="text-gray-600">Os últimos 5 documentos gerados aparecerão aqui</p>
            <div id="historico" class="mt-4"></div>
        </div>
    </div>

    <script>
        const API_KEY_STORAGE_KEY = 'groq_api_key';
        
        // Elementos
        const apiKeyInput = document.getElementById('apiKey');
        const docAnteriorInput = document.getElementById('docAnterior');
        const transcricaoInput = document.getElementById('transcricao');
        const btnProcessar = document.getElementById('btnProcessar');
        const btnTexto = document.getElementById('btnTexto');
        const erro = document.getElementById('erro');
        const sucesso = document.getElementById('sucesso');
        const apiSalva = document.getElementById('apiSalva');
        const docAnteriorNome = document.getElementById('docAnteriorNome');
        const transcricaoNome = document.getElementById('transcricaoNome');

        // Carregar API Key salva
        const savedApiKey = localStorage.getItem(API_KEY_STORAGE_KEY);
        if (savedApiKey) {
            apiKeyInput.value = savedApiKey;
            apiSalva.textContent = '✓ Salva';
        }

        // Salvar API Key quando mudar
        apiKeyInput.addEventListener('input', () => {
            if (apiKeyInput.value.length > 10) {
                localStorage.setItem(API_KEY_STORAGE_KEY, apiKeyInput.value);
                apiSalva.textContent = '✓ Salva';
            }
            verificarCampos();
        });

        // Mostrar nome do arquivo selecionado
        docAnteriorInput.addEventListener('change', () => {
            if (docAnteriorInput.files[0]) {
                docAnteriorNome.textContent = `✓ ${docAnteriorInput.files[0].name}`;
            }
            verificarCampos();
        });

        transcricaoInput.addEventListener('change', () => {
            if (transcricaoInput.files[0]) {
                transcricaoNome.textContent = `✓ ${transcricaoInput.files[0].name}`;
            }
            verificarCampos();
        });

        // Verificar se todos os campos estão preenchidos
        function verificarCampos() {
            const apiOk = apiKeyInput.value.length > 10;
            const docOk = docAnteriorInput.files.length > 0;
            const transOk = transcricaoInput.files.length > 0;

            if (apiOk && docOk && transOk) {
                btnProcessar.disabled = false;
                btnProcessar.classList.remove('bg-gray-400');
                btnProcessar.classList.add('bg-blue-600', 'hover:bg-blue-700');
            } else {
                btnProcessar.disabled = true;
                btnProcessar.classList.add('bg-gray-400');
                btnProcessar.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            }
        }

        // Processar round
        btnProcessar.addEventListener('click', async () => {
            erro.classList.add('hidden');
            sucesso.classList.add('hidden');
            
            btnProcessar.disabled = true;
            btnTexto.textContent = 'Processando...';

            try {
                // TODO: Implementar processamento real com Groq API
                // Por enquanto, simula processamento
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                sucesso.textContent = 'Documento processado com sucesso! (Em desenvolvimento)';
                sucesso.classList.remove('hidden');
            } catch (err) {
                erro.textContent = 'Erro: ' + err.message;
                erro.classList.remove('hidden');
            } finally {
                btnProcessar.disabled = false;
                btnTexto.textContent = 'Gerar Round de Hoje';
                verificarCampos();
            }
        });

        // Verificar campos ao carregar
        verificarCampos();
    </script>
</body>
</html>
